<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprobación de Afiliados</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet"/>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body {
            background-color: #f0f2f5;
            font-family: 'Hanken Grotesk', sans-serif;
        }
        #reader {
            width: 100%;
            border-radius: 1rem;
            overflow: hidden;
            display: none;
            margin-top: 1rem;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.08)] max-w-sm w-full mx-auto flex flex-col items-center">
        
        <h1 class="text-[22px] font-bold text-gray-800 text-center mb-2">Comprobación de Afiliados</h1>
        <p class="text-sm text-gray-500 text-center mb-8 px-2 leading-relaxed">
            Verifique la vigencia y autenticidad de la credencial digital mediante código QR o número de DNI.
        </p>

        <!-- Botón Escanear QR -->
        <button id="start-btn" onclick="startScanner()" 
                class="w-full bg-[#0d47a1] hover:bg-[#1565c0] text-white font-bold py-3.5 px-4 rounded-full flex items-center justify-center gap-3 transition-colors shadow-md">
            <span class="material-symbols-outlined text-2xl">qr_code_scanner</span>
            <span>ESCANEAR CREDENCIAL QR</span>
        </button>

        <button id="stop-btn" onclick="stopScanner()" style="display: none;"
                class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-3.5 px-4 rounded-full flex items-center justify-center gap-3 transition-colors shadow-md mt-4">
            <span class="material-symbols-outlined text-2xl">cancel</span>
            <span>CANCELAR ESCANEO</span>
        </button>

        <div id="reader" class="border-2 border-dashed border-gray-300"></div>

        <!-- Separador -->
        <div class="flex items-center w-full my-8">
            <hr class="flex-grow border-gray-200">
            <span class="px-3 text-[10px] font-bold text-gray-400 tracking-wider">O CONSULTAR POR DNI</span>
            <hr class="flex-grow border-gray-200">
        </div>

        <!-- Input DNI -->
        <div class="w-full relative mb-4">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <span class="material-symbols-outlined text-blue-600/70">badge</span>
            </div>
            <input type="number" id="dni-input" placeholder="Ingrese el DNI (solo números)" 
                   class="w-full pl-12 pr-4 py-3.5 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-[#0d47a1] focus:border-transparent text-gray-700 bg-gray-50">
        </div>

        <!-- Botón Comprobar DNI -->
        <button onclick="checkByDni()" 
                class="w-full bg-white border-2 border-[#0d47a1] text-[#0d47a1] hover:bg-blue-50 font-bold py-3 px-4 rounded-full transition-colors">
            COMPROBAR DNI
        </button>

        <!-- Footer -->
        <div class="mt-10 text-center">
            <p class="text-xs font-bold text-gray-600">Mi Credencial Online</p>
            <p class="text-[10px] text-gray-400 mt-0.5">Verificación instantánea para comercios y convenios</p>
        </div>

        <!-- Resultado Modal/Contenedor -->
        <div id="result-container" class="mt-6 w-full hidden p-5 rounded-2xl text-center shadow-inner">
            <h3 id="result-title" class="text-lg font-bold mb-1"></h3>
            <p id="result-message" class="text-sm mb-4 opacity-90"></p>
            <div id="result-data" class="hidden text-left bg-white/50 rounded-xl p-4 text-sm shadow-sm">
                <p class="mb-1"><span class="font-bold text-gray-600">Nombre:</span> <span id="data-name" class="font-medium text-gray-800"></span></p>
                <p class="mb-1"><span class="font-bold text-gray-600">DNI:</span> <span id="data-dni" class="font-medium text-gray-800"></span></p>
                <p class="mb-1"><span class="font-bold text-gray-600">N° Afiliado:</span> <span id="data-nro" class="font-medium text-gray-800"></span></p>
                <p><span class="font-bold text-gray-600">Estado:</span> <span id="data-status" class="uppercase font-extrabold tracking-wide"></span></p>
            </div>
        </div>

    </div>

    <script>
        let html5QrcodeScanner = null;

        function startScanner() {
            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('stop-btn').style.display = 'flex';
            document.getElementById('reader').style.display = 'block';
            hideResult();

            html5QrcodeScanner = new Html5Qrcode("reader");
            const config = { fps: 10, qrbox: { width: 250, height: 250 } };

            html5QrcodeScanner.start(
                { facingMode: "environment" }, 
                config, 
                onScanSuccess,
                onScanFailure
            ).catch(err => {
                alert("Error al acceder a la cámara: Por favor, asegúrese de usar HTTPS y otorgar permisos de cámara.");
                stopScanner();
            });
        }

        function stopScanner() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    document.getElementById('start-btn').style.display = 'flex';
                    document.getElementById('stop-btn').style.display = 'none';
                    document.getElementById('reader').style.display = 'none';
                }).catch(err => {
                    console.error("Error al detener scanner.", err);
                });
            }
        }

        function onScanSuccess(decodedText, decodedResult) {
            stopScanner();
            
            try {
                const data = JSON.parse(decodedText);
                
                if (data.status && data.status.toLowerCase() === 'activo') {
                    showResult(true, "Validación Exitosa", "La credencial escaneada se encuentra ACTIVA.", data);
                } else {
                    showResult(false, "Credencial Inválida", "La credencial escaneada se encuentra VENCIDA o INACTIVA.", data);
                }
                
            } catch (e) {
                console.error("Error parsing QR", e);
                showResult(false, "QR Inválido", "El formato del código QR escaneado no es reconocido por este sistema.");
            }
        }

        function onScanFailure(error) {
            // Se ignora para no saturar los logs
        }

        async function checkByDni() {
            const dni = document.getElementById('dni-input').value.trim();
            if (!dni) {
                alert("Por favor ingrese un número de DNI.");
                return;
            }

            const btn = document.querySelector('button[onclick="checkByDni()"]');
            const originalText = btn.innerText;
            btn.innerText = "Consultando...";
            btn.disabled = true;

            try {
                // URL del script (de AppConfig.loginApiUrl)
                const apiUrl = 'https://script.google.com/macros/s/AKfycbw5hL-QxkZiAt8G05pEDcpvKzQBOXCcuT2ZVE_PYkz9G1ZvwJ5-edoOQGjK99Z0F-3z2A/exec';
                const response = await fetch(`${apiUrl}?dni=${dni}`);
                const data = await response.json();

                if (data.success) {
                    // Adaptar el JSON del backend al formato que espera showResult
                    const adaptedData = {
                        name: data.nombre,
                        dni: data.dni,
                        nro: data.nroAfiliado,
                        status: 'activo' // Asumimos activo si se encuentra en la base, o puedes derivarlo de data.vto
                    };
                    showResult(true, "Validación Exitosa", "El DNI consultado se encuentra registrado y activo.", adaptedData);
                } else {
                    showResult(false, "DNI no encontrado", data.message);
                }
            } catch (error) {
                showResult(false, "Error de Conexión", "No se pudo conectar con la base de datos. Intente más tarde.");
                console.error("Fetch error:", error);
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        function showResult(isValid, title, message, data = null) {
            const container = document.getElementById('result-container');
            const titleEl = document.getElementById('result-title');
            const messageEl = document.getElementById('result-message');
            const dataContainer = document.getElementById('result-data');
            
            container.classList.remove('hidden', 'bg-green-100', 'bg-red-100', 'bg-blue-100', 'text-green-800', 'text-red-800', 'text-blue-800');
            titleEl.innerText = title;
            messageEl.innerText = message;

            if (isValid) {
                container.classList.add('bg-green-100', 'text-green-800');
            } else {
                container.classList.add(title === 'Consulta Online' ? 'bg-blue-100' : 'bg-red-100', title === 'Consulta Online' ? 'text-blue-800' : 'text-red-800');
            }

            if (data) {
                dataContainer.classList.remove('hidden');
                document.getElementById('data-name').innerText = data.name || '-';
                document.getElementById('data-dni').innerText = data.dni || '-';
                document.getElementById('data-nro').innerText = data.nro || '-';
                
                const statusEl = document.getElementById('data-status');
                statusEl.innerText = data.status || '-';
                if (data.status && data.status.toLowerCase() === 'activo') {
                    statusEl.className = 'uppercase font-extrabold tracking-wide text-green-700';
                } else {
                    statusEl.className = 'uppercase font-extrabold tracking-wide text-red-700';
                }
            } else {
                dataContainer.classList.add('hidden');
            }
        }

        function hideResult() {
            document.getElementById('result-container').classList.add('hidden');
        }
    </script>
</body>
</html>
