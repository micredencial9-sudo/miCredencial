<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Credencial Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body {
            background-color: #f3f4f6;
            font-family: system-ui, -apple-system, sans-serif;
        }
        #reader {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            border-radius: 0.5rem;
            overflow: hidden;
            display: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-white p-8 rounded-xl shadow-lg max-w-md w-full">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Verificador de Credencial</h1>
            <p class="text-gray-500 mt-2">Ingrese el DNI y escanee el QR del afiliado</p>
        </div>

        <div class="mb-4">
            <label for="dni-input" class="block text-sm font-medium text-gray-700 mb-1">DNI del Afiliado</label>
            <input type="text" id="dni-input" placeholder="Ej: 12345678" 
                   class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
        </div>

        <button id="start-btn" onclick="startScanner()" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-md transition duration-200">
            Escanear Credencial QR
        </button>

        <button id="stop-btn" onclick="stopScanner()" style="display: none;"
                class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-4 rounded-md transition duration-200 mt-2">
            Cancelar Escaneo
        </button>

        <div id="reader" class="mt-6 border-2 border-dashed border-gray-300"></div>

        <div id="result-container" class="mt-6 hidden p-4 rounded-md text-center">
            <h3 id="result-title" class="text-lg font-bold"></h3>
            <p id="result-message" class="text-sm mt-1"></p>
            <div id="result-data" class="mt-3 text-left text-sm hidden">
                <p><strong>Nombre:</strong> <span id="data-name"></span></p>
                <p><strong>DNI:</strong> <span id="data-dni"></span></p>
                <p><strong>N° Afiliado:</strong> <span id="data-nro"></span></p>
                <p><strong>Estado:</strong> <span id="data-status" class="uppercase font-bold"></span></p>
            </div>
        </div>
    </div>

    <script>
        let html5QrcodeScanner = null;

        function startScanner() {
            const dniInput = document.getElementById('dni-input').value.trim();
            if (!dniInput) {
                alert("Por favor ingrese el DNI antes de escanear.");
                return;
            }

            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('stop-btn').style.display = 'block';
            document.getElementById('reader').style.display = 'block';
            hideResult();

            html5QrcodeScanner = new Html5Qrcode("reader");
            const config = { fps: 10, qrbox: { width: 250, height: 250 } };

            html5QrcodeScanner.start(
                { facingMode: "environment" }, 
                config, 
                onScanSuccess,
                onScanFailure
            ).catch(err => {
                alert("Error al acceder a la cámara: " + err);
                stopScanner();
            });
        }

        function stopScanner() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    document.getElementById('start-btn').style.display = 'block';
                    document.getElementById('stop-btn').style.display = 'none';
                    document.getElementById('reader').style.display = 'none';
                }).catch(err => {
                    console.error("Error al detener scanner.", err);
                });
            }
        }

        function onScanSuccess(decodedText, decodedResult) {
            stopScanner();
            
            const expectedDni = document.getElementById('dni-input').value.trim();
            
            try {
                const data = JSON.parse(decodedText);
                
                if (data.dni === expectedDni) {
                    if (data.status && data.status.toLowerCase() === 'activo') {
                        showResult(true, "Validación Exitosa", "La credencial corresponde al afiliado y se encuentra activa.", data);
                    } else {
                        showResult(false, "Credencial Vencida", "El DNI coincide, pero la credencial se encuentra vencida o inactiva.", data);
                    }
                } else {
                    showResult(false, "DNI Incorrecto", `El código QR pertenece al DNI ${data.dni}, pero se esperaba el DNI ${expectedDni}.`, data);
                }
            } catch (e) {
                console.error("Error parsing QR", e);
                showResult(false, "QR Inválido", "El formato del código QR no es válido para esta aplicación.");
            }
        }

        function onScanFailure(error) {
            // Se ignora para no saturar los logs
        }

        function showResult(isValid, title, message, data = null) {
            const container = document.getElementById('result-container');
            const titleEl = document.getElementById('result-title');
            const messageEl = document.getElementById('result-message');
            const dataContainer = document.getElementById('result-data');
            
            container.classList.remove('hidden', 'bg-green-100', 'bg-red-100', 'text-green-800', 'text-red-800');
            titleEl.innerText = title;
            messageEl.innerText = message;

            if (isValid) {
                container.classList.add('bg-green-100', 'text-green-800');
            } else {
                container.classList.add('bg-red-100', 'text-red-800');
            }

            if (data) {
                dataContainer.classList.remove('hidden');
                document.getElementById('data-name').innerText = data.name || '-';
                document.getElementById('data-dni').innerText = data.dni || '-';
                document.getElementById('data-nro').innerText = data.nro || '-';
                
                const statusEl = document.getElementById('data-status');
                statusEl.innerText = data.status || '-';
                if (data.status && data.status.toLowerCase() === 'activo') {
                    statusEl.className = 'uppercase font-bold text-green-700';
                } else {
                    statusEl.className = 'uppercase font-bold text-red-700';
                }
            } else {
                dataContainer.classList.add('hidden');
            }
        }

        function hideResult() {
            document.getElementById('result-container').classList.add('hidden');
        }
    </script>
</body>
</html>
